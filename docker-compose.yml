services:
  redaccion:
    build:
      context: .
      dockerfile: Dockerfile
    image: redaccion:latest
    container_name: redaccion-web
    restart: unless-stopped
    ports:
      - "${PORT:-8767}:8767"
    environment:
      - PORT=8767
      - BIND_ADDR=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VITE_DEEPSEEK_API_KEY=${VITE_DEEPSEEK_API_KEY:-}
      - VITE_GOOGLE_DRIVE_CLIENT_ID=${VITE_GOOGLE_DRIVE_CLIENT_ID:-}
      - VITE_GOOGLE_DRIVE_API_KEY=${VITE_GOOGLE_DRIVE_API_KEY:-}
      - VITE_GOOGLE_DRIVE_CLIENT_SECRET=${VITE_GOOGLE_DRIVE_CLIENT_SECRET:-}
      - VITE_DRIVE_TEMPLATES_FOLDER_ID=${VITE_DRIVE_TEMPLATES_FOLDER_ID:-}
      - VITE_DRIVE_DESTINATION_FOLDER_ID=${VITE_DRIVE_DESTINATION_FOLDER_ID:-}
      - VITE_GOOGLE_SHEETS_LOG_ID=${VITE_GOOGLE_SHEETS_LOG_ID:-}
      - VITE_PREVIEW_API_URL=${VITE_PREVIEW_API_URL:-/api-preview}
      - VITE_STORAGE_MODE=${VITE_STORAGE_MODE:-google}
      - VITE_NEXTCLOUD_URL=${VITE_NEXTCLOUD_URL:-}
      - VITE_NEXTCLOUD_CLIENT_ID=${VITE_NEXTCLOUD_CLIENT_ID:-}
      - VITE_NEXTCLOUD_CLIENT_SECRET=${VITE_NEXTCLOUD_CLIENT_SECRET:-}
      - VITE_NEXTCLOUD_TEMPLATES_PATH=${VITE_NEXTCLOUD_TEMPLATES_PATH:-/Flujo_editorial/Plantillas}
      - VITE_NEXTCLOUD_DESTINATION_PATH=${VITE_NEXTCLOUD_DESTINATION_PATH:-/Flujo_editorial/Redaccion}
    volumes:
      - redaccion_documents:/app/documents
      - redaccion_templates:/app/templates
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8767/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redaccion_documents:
    driver: local
  redaccion_templates:
    driver: local
